const { useState, useEffect, useMemo, useRef, useCallback, Fragment, forwardRef } = React;

];

const CATEGORIE_PRODOTTI = [
  'Bevande alcoliche', 'Bevande analcoliche', 'Caffetteria', 'Snack/Dolci',

const UNITA_MISURA = ['pz', 'kg', 'g', 'l', 'ml', 'cf', 'cassa', 'bottiglia', 'lattina', 'cartone'];

// ============================================================
// INIZIALIZZAZIONE FIREBASE
// ============================================================
let db = null;
let firebaseOk = false;
try {
  if (FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('INSERISCI')) {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    firebaseOk = true;
  }
} catch (e) {
  console.error('Firebase init error', e);
}

// ============================================================
// HELPER
// ============================================================
const fmtEur = (n) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(n || 0);
const fmtData = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
};
const fmtDataLunga = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
};
const oggiISO = () => new Date().toISOString().slice(0, 10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// Normalizza un numero di telefono per WhatsApp (formato senza + iniziale)
const normalizzaTelefono = (tel) => {
  if (!tel) return '';
  let n = String(tel).replace(/[^0-9]/g, '');
  if (n.startsWith('00')) n = n.slice(2);
  // Cellulare italiano tipico: 10 cifre che iniziano con 3
  if (n.length === 10 && n.startsWith('3')) n = '39' + n;
  return n;
};

const useDB = (path) => {
  const [data, setData] = useState({});
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!db) { setLoading(false); return; }
    const ref = db.ref(path);
    const cb = (snap) => { setData(snap.val() || {}); setLoading(false); };
    ref.on('value', cb);
    return () => ref.off('value', cb);
  }, [path]);
  return [data, loading];
};

const dbSet = (path, value) => db && db.ref(path).set(value);
const dbPush = (path, value) => {
  if (!db) return null;
  const ref = db.ref(path).push();
  ref.set({ ...value, id: ref.key });
  return ref.key;
};
const dbUpdate = (path, value) => db && db.ref(path).update(value);
const dbRemove = (path) => db && db.ref(path).remove();

// ============================================================
// COMPONENTI UI
// ============================================================
const Modal = ({ open, onClose, title, children, size = 'md' }) => {
  if (!open) return null;
  const sizes = { sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-4xl', xl: 'max-w-6xl' };
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/50 backdrop-blur-sm anim-in" onClick={onClose}>

          <button onClick={onClose} className="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-xl">✕</button>
        </div>
        <div className="overflow-y-auto p-5 flex-1">{children}</div>
      </div>
    </div>
  );
};

const Btn = ({ children, onClick, variant = 'primary', className = '', type = 'button', disabled = false }) => {
  const variants = {
    primary: 'psb-gradient text-white hover:opacity-90',
    gold: 'bg-amber-500 text-white hover:bg-amber-600',
    ghost: 'bg-white text-blue-900 hover:bg-blue-50 border border-blue-200',
    danger: 'bg-red-500 text-white hover:bg-red-600',
    success: 'bg-emerald-600 text-white hover:bg-emerald-700',
    whatsapp: 'bg-[#25D366] text-white hover:bg-[#128C7E]',
  };
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      className={`px-4 py-2.5 rounded-xl font-semibold text-sm transition shadow-sm hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:translate-y-0 ${variants[variant]} ${className}`}>
      {children}
    </button>
  );
};

const Input = forwardRef(({ label, error, ...props }, ref) => (

    {label && <label className="text-sm font-semibold text-blue-900">{label}</label>}

const Select = ({ label, options, ...props }) => (

const TextArea = ({ label, ...props }) => (

const StatCard = ({ icon, label, value, color }) => {
  const colors = {
    blue: 'from-blue-600 to-blue-800',
    amber: 'from-amber-500 to-amber-700',
    emerald: 'from-emerald-500 to-emerald-700',
    violet: 'from-violet-500 to-violet-700',
  };
  return (
    <div className={`bg-gradient-to-br ${colors[color]} text-white rounded-2xl p-4 shadow-sm`}>
      <div className="text-2xl mb-1">{icon}</div>
      <p className="text-xs text-white/80">{label}</p>
      <p className="text-lg sm:text-xl font-bold mt-1 truncate">{value}</p>
    </div>
  );
};

const MagazzinoDashboard = ({ prodotti, acquisti, fornitori }) => {
  const prodList = Object.values(prodotti);
  const acqList = Object.values(acquisti);
  const sottoSoglia = prodList.filter(p => p.scortaMinima && p.scorta <= p.scortaMinima);
  const valoreScorte = prodList.reduce((sum, p) => sum + (p.scorta || 0) * (p.prezzoMedio || 0), 0);
  const acquistiMese = acqList.filter(a => {
    const d = new Date(a.data);
    const ora = new Date();
    return d.getMonth() === ora.getMonth() && d.getFullYear() === ora.getFullYear();
  });
  const spesaMese = acquistiMese.reduce((s, a) => s + (a.totale || 0), 0);

  return (
    <div className="p-4 max-w-7xl mx-auto space-y-4">
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard icon="📦" label="Prodotti" value={prodList.length} color="blue" />
        <StatCard icon="🏪" label="Fornitori" value={Object.keys(fornitori).length} color="amber" />
        <StatCard icon="💰" label="Valore scorte" value={fmtEur(valoreScorte)} color="emerald" />
        <StatCard icon="🛒" label="Spesa mese" value={fmtEur(spesaMese)} color="violet" />
      </div>

      {sottoSoglia.length > 0 && (
        <div className="bg-red-50 border border-red-200 rounded-2xl p-4">
          <h3 className="font-display text-red-800 mb-2 flex items-center gap-2">
            ⚠️ Prodotti sotto scorta minima ({sottoSoglia.length})
          </h3>
          <div className="space-y-1 text-sm">
            {sottoSoglia.map(p => (
              <div key={p.id} className="flex justify-between bg-white px-3 py-2 rounded-lg">
                <span className="font-semibold">{p.nome}</span>
                <span className="text-red-600 font-semibold">{p.scorta} {p.unita} (min: {p.scortaMinima})</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="bg-white rounded-2xl shadow-sm p-4">
        <h3 className="font-display text-blue-900 mb-3">📋 Ultimi acquisti</h3>
        {acqList.length === 0 ? (
          <p className="text-sm text-gray-500 text-center py-4">Nessun acquisto registrato</p>
        ) : (
          <div className="space-y-2">
            {acqList.sort((a, b) => (b.data || '').localeCompare(a.data || '')).slice(0, 5).map(a => (
              <div key={a.id} className="flex justify-between items-center border-b last:border-b-0 pb-2">
                <div>
                  <p className="font-semibold text-sm">{fornitori[a.fornitoreId]?.nome || 'Fornitore'}</p>
                  <p className="text-xs text-gray-500">{fmtData(a.data)} • {a.numeroFattura || 'Senza fattura'}</p>
                </div>
                <span className="font-semibold text-blue-900">{fmtEur(a.totale)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
};

// ============================================================
// MAGAZZINO - PRODOTTI
// ============================================================
const ProdottoModal = ({ prodotto, onClose }) => {
  const isNew = !prodotto.id;
  const [form, setForm] = useState({
    nome: '', categoria: CATEGORIE_PRODOTTI[0], unita: 'pz',
    scorta: 0, scortaMinima: 0, prezzoMedio: 0, prezzoVendita: 0, note: '',
    ...prodotto
  });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const salva = () => {
    if (!form.nome.trim()) return alert('Nome obbligatorio');

const ScaricoModal = ({ prodotto, onClose }) => {
  const [quantita, setQuantita] = useState('');
  const [motivo, setMotivo] = useState('Consumo');
  const conferma = () => {
    const q = Number(quantita);
    if (!q || q <= 0) return alert('Quantità non valida');
    if (q > prodotto.scorta) {
      if (!confirm(`Quantità maggiore della scorta (${prodotto.scorta}). Continuare comunque?`)) return;
    }
    const nuovaScorta = (prodotto.scorta || 0) - q;
    dbUpdate(`taverna/prodotti/${prodotto.id}`, { scorta: nuovaScorta });
    dbPush('taverna/movimenti', {
      data: oggiISO(), tipo: 'scarico', prodottoId: prodotto.id,
      prodottoNome: prodotto.nome, quantita: q, motivo
    });
    onClose();
  };
  return (
    <Modal open={true} onClose={onClose} title={`Scarico: ${prodotto.nome}`} size="sm">
      <div className="space-y-3">
        <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 text-sm">
          Scorta attuale: <b>{prodotto.scorta || 0} {prodotto.unita}</b>
        </div>
        <Input label={`Quantità da scaricare (${prodotto.unita})`} type="number" value={quantita}
          onChange={e => setQuantita(e.target.value)} autoFocus />
        <Select label="Motivo" value={motivo} onChange={e => setMotivo(e.target.value)}
          options={['Consumo', 'Vendita', 'Scaduto', 'Rotto/Danneggiato', 'Altro']} />
        <div className="flex gap-2 pt-2">

const AcquistoModal = ({ acquisto, prodotti, fornitori, onClose }) => {
  const isNew = !acquisto.id;
  const [form, setForm] = useState({
    data: oggiISO(), fornitoreId: '', numeroFattura: '', note: '',
    items: [], ...acquisto
  });
  const items = form.items || [];
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const fornList = Object.values(fornitori).sort((a, b) => a.nome.localeCompare(b.nome));
  const prodList = Object.values(prodotti).sort((a, b) => a.nome.localeCompare(b.nome));

  const addRiga = () => {
    set('items', [...items, { id: uid(), prodottoId: '', quantita: 1, prezzoUnitario: 0 }]);
  };
  const updateRiga = (id, k, v) => {
    set('items', items.map(i => i.id === id ? { ...i, [k]: v } : i));
  };
  const removeRiga = (id) => set('items', items.filter(i => i.id !== id));

  const totale = items.reduce((s, i) => s + (Number(i.quantita) || 0) * (Number(i.prezzoUnitario) || 0), 0);

  const salva = () => {
    if (!form.fornitoreId) return alert('Seleziona un fornitore');
    if (items.length === 0) return alert('Aggiungi almeno una riga');
    const data = { ...form, totale };

    if (isNew) {
      items.forEach(i => {
        if (i.prodottoId) {
          const p = prodotti[i.prodottoId];
          if (p) {
            const nuovaScorta = (Number(p.scorta) || 0) + Number(i.quantita);
            const scOld = Number(p.scorta) || 0;
            const pmOld = Number(p.prezzoMedio) || 0;
            const qNew = Number(i.quantita);
            const pNew = Number(i.prezzoUnitario);
            const nuovoPm = (scOld + qNew) > 0
              ? ((scOld * pmOld) + (qNew * pNew)) / (scOld + qNew)
              : pNew;
            dbUpdate(`taverna/prodotti/${i.prodottoId}`, {
              scorta: nuovaScorta,
              prezzoMedio: Math.round(nuovoPm * 100) / 100
            });
          }
        }
      });
      dbPush('taverna/acquisti', data);
    } else {
      dbUpdate(`taverna/acquisti/${acquisto.id}`, data);
    }
    onClose();
  };

  const elimina = () => {
    if (confirm('Eliminare questo acquisto? Le scorte non verranno modificate automaticamente.')) {
      dbRemove(`taverna/acquisti/${acquisto.id}`);
      onClose();
    }
  };

  return (
    <Modal open={true} onClose={onClose} title={isNew ? 'Nuovo acquisto' : `Acquisto del ${fmtData(form.data)}`} size="lg">
      <div className="space-y-4">
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <Input label="Data *" type="date" value={form.data} onChange={e => set('data', e.target.value)} />
          <Select label="Fornitore *" value={form.fornitoreId} onChange={e => set('fornitoreId', e.target.value)}
            options={[{ value: '', label: '— Seleziona —' }, ...fornList.map(f => ({ value: f.id, label: f.nome }))]} />
          <Input label="Numero fattura/DDT" value={form.numeroFattura} onChange={e => set('numeroFattura', e.target.value)} />
        </div>

        <div>
          <div className="flex justify-between items-center mb-2">
            <h4 className="font-semibold text-blue-900">Righe acquisto</h4>
            <button onClick={addRiga} className="text-sm text-blue-700 font-semibold hover:underline">+ Aggiungi riga</button>
          </div>
          {items.length === 0 ? (
            <p className="text-center text-sm text-gray-500 py-6 border-2 border-dashed rounded-xl">Nessuna riga inserita</p>
          ) : (
            <div className="space-y-2">
              {items.map((r) => {
                const subtotale = (Number(r.quantita) || 0) * (Number(r.prezzoUnitario) || 0);
                return (
                  <div key={r.id} className="bg-blue-50 rounded-xl p-3 grid grid-cols-12 gap-2 items-center">
                    <div className="col-span-12 sm:col-span-5">
                      <Select value={r.prodottoId} onChange={e => updateRiga(r.id, 'prodottoId', e.target.value)}
                        options={[{ value: '', label: '— Prodotto —' }, ...prodList.map(p => ({ value: p.id, label: `${p.nome} (${p.unita})` }))]} />
                    </div>
                    <div className="col-span-4 sm:col-span-2">
                      <input type="number" step="0.01" placeholder="Q.tà" value={r.quantita}
                        onChange={e => updateRiga(r.id, 'quantita', e.target.value)}
                        className="w-full px-2 py-2 rounded-lg border text-sm" />
                    </div>
                    <div className="col-span-4 sm:col-span-2">
                      <input type="number" step="0.01" placeholder="€/unità" value={r.prezzoUnitario}
                        onChange={e => updateRiga(r.id, 'prezzoUnitario', e.target.value)}
                        className="w-full px-2 py-2 rounded-lg border text-sm" />
                    </div>
                    <div className="col-span-3 sm:col-span-2 text-right font-semibold text-sm text-blue-900">{fmtEur(subtotale)}</div>
                    <button onClick={() => removeRiga(r.id)} className="col-span-1 text-red-500 hover:text-red-700">✕</button>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        <TextArea label="Note" rows={2} value={form.note} onChange={e => set('note', e.target.value)} />

        <div className="bg-blue-900 text-white rounded-xl p-4 flex justify-between items-center">
          <span className="font-semibold">Totale acquisto</span>
          <span className="font-display text-2xl text-amber-300">{fmtEur(totale)}</span>
        </div>

        {isNew && (
          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">
            ℹ️ Le scorte dei prodotti selezionati verranno aggiornate automaticamente al salvataggio, con ricalcolo del prezzo medio ponderato.
          </div>
        )}

        <div className="flex gap-2 pt-2">
          {!isNew && <Btn variant="danger" onClick={elimina}>🗑️ Elimina</Btn>}
          <Btn variant="ghost" onClick={onClose} className="flex-1">Annulla</Btn>
          <Btn onClick={salva} className="flex-1">{isNew ? 'Registra' : 'Salva'}</Btn>
        </div>
      </div>
    </Modal>
  );
};

const EventoModal = ({ evento, tavoli, onClose }) => {
  const isNew = !evento.id;

    nome: '', data: oggiISO(), tipo: 'cena', note: '', ricorrente: false, ...evento
  });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const salva = () => {
    if (!form.nome.trim()) return alert('Nome evento obbligatorio');
    if (!form.data) return alert('Data obbligatoria');
    if (isNew) {
      const tavoliEv = {};
      Object.values(tavoli).forEach(t => {
        tavoliEv[t.id] = {
          numero: t.numero, posti: t.posti, sala: t.sala,
          commensali: Array(t.posti).fill(null).map(() => ({ nome: '', note: '', telefono: '', pagato: false }))
        };
      });
      dbPush('taverna/eventi', { ...form, tavoli: tavoliEv, createdAt: Date.now() });
    } else {
      const { tavoli: _, ...payload } = form;
      dbUpdate(`taverna/eventi/${evento.id}`, payload);
    }
    onClose();
  };
  const elimina = () => {
    if (confirm(`Eliminare l'evento "${form.nome}"? Tutte le prenotazioni andranno perse.`)) {
      dbRemove(`taverna/eventi/${evento.id}`);
      onClose();
    }

    <Modal open={true} onClose={onClose} title={isNew ? 'Nuovo evento' : 'Modifica evento'}>
      <div className="space-y-3">
        <Input label="Nome evento *" value={form.nome} onChange={e => set('nome', e.target.value)}

        </div>
        <TextArea label="Note" rows={3} value={form.note} onChange={e => set('note', e.target.value)}
          placeholder="Menù, costo, organizzatori..." />

          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800">

  const lista = Object.values(eventi)
    .filter(e => {
      if (filtroData === 'futuri') return (e.data || '') >= oggi;
      if (filtroData === 'passati') return (e.data || '') < oggi;
      return true;
    })
    .sort((a, b) => filtroData === 'passati' ? (b.data || '').localeCompare(a.data || '') : (a.data || '').localeCompare(b.data || ''));

  const calcPosti = (ev) => {
    const tavoliEv = ev.tavoli || {};
    let occupati = 0, totale = 0, extra = 0, pagati = 0;
    Object.values(tavoliEv).forEach(t => {
      totale += t.posti || 0;
      const occupatiTavolo = (t.commensali || []).filter(c => c && c.nome).length;
      const pagatiTavolo = (t.commensali || []).filter(c => c && c.nome && c.pagato).length;
      occupati += occupatiTavolo;
      pagati += pagatiTavolo;
      extra += Math.max(0, occupatiTavolo - (t.posti || 0));
    });
    return { occupati, totale, extra, pagati };
  };

  return (
    <div className="p-4 max-w-7xl mx-auto space-y-3">
      <div className="flex flex-col sm:flex-row sm:justify-between gap-3">
        <div className="flex gap-1 bg-white rounded-xl p-1 shadow-sm w-fit">
          {[{ id: 'futuri', l: 'Prossimi' }, { id: 'passati', l: 'Passati' }, { id: 'tutti', l: 'Tutti' }].map(f => (
            <button key={f.id} onClick={() => setFiltroData(f.id)}
              className={`px-3 py-1.5 text-sm font-semibold rounded-lg transition ${filtroData === f.id ? 'psb-gradient text-white' : 'text-gray-600'}`}>
              {f.l}
            </button>
          ))}
        </div>
        <Btn onClick={() => setEditing({})}>+ Nuovo evento</Btn>
      </div>

      {lista.length === 0 ? (
        <EmptyState icon="🍽️" title={filtroData === 'futuri' ? 'Nessun evento in programma' : 'Nessun evento'}
          hint="Crea il primo evento (pranzo o cena) per iniziare a gestire i posti a tavola"
          action={<Btn onClick={() => setEditing({})}>+ Nuovo evento</Btn>} />
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {lista.map(ev => {
            const { occupati, totale, extra, pagati } = calcPosti(ev);
            const percent = totale > 0 ? Math.min(100, Math.round((occupati / totale) * 100)) : 0;
            const percentPagati = occupati > 0 ? Math.round((pagati / occupati) * 100) : 0;
            return (
              <div key={ev.id} className={`surface-card card-lift rounded-3xl overflow-hidden ${extra > 0 ? 'ring-2 ring-red-300' : ''}`}>
                <div className="psb-gradient text-white p-4">
                  <div className="flex justify-between items-start">
                    <div>
                      <p className="text-amber-300 text-xs uppercase tracking-wide">{ev.tipo === 'cena' ? '🌙 Cena' : ev.tipo === 'pranzo' ? '☀️ Pranzo' : '🎉 Evento'}</p>
                      <h3 className="font-display text-lg mt-1">{ev.nome}</h3>
                    </div>
                  </div>
                  <p className="text-sm text-white/80 mt-2 capitalize">{fmtDataLunga(ev.data)}</p>
                </div>
                <div className="p-4">
                  <div className="flex justify-between text-sm mb-1">
                    <span className="text-gray-600">Posti</span>
                    <span className={`font-bold ${extra > 0 ? 'text-red-600' : 'text-blue-950'}`}>{occupati} / {totale}</span>
                  </div>
                  <div className="w-full bg-gray-100 rounded-full h-2 overflow-hidden">
                    <div className={`${extra > 0 ? 'bg-red-500' : 'psb-gradient'} h-full transition-all`} style={{ width: `${percent}%` }}></div>
                  </div>
                  {occupati > 0 && (
                    <>
                      <div className="flex justify-between text-xs mt-3 mb-1">
                        <span className="text-emerald-700 font-semibold">💰 Quote pagate</span>
                        <span className="font-bold text-emerald-700">{pagati} / {occupati} ({percentPagati}%)</span>
                      </div>
                      <div className="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                        <div className="bg-emerald-500 h-full transition-all" style={{ width: `${percentPagati}%` }}></div>
                      </div>
                    </>
                  )}
                  {extra > 0 && <div className="mt-3 over-badge rounded-xl px-3 py-2 text-xs font-bold flex justify-between"><span>⚠️ Capienza superata</span><span>+{extra} extra</span></div>}
                  <div className="flex gap-2 mt-3">
                    <Btn variant="ghost" onClick={() => setEditing(ev)} className="flex-1">Modifica</Btn>
                    <Btn variant="gold" onClick={() => onApriEvento(ev.id)} className="flex-1">Gestisci posti</Btn>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {editing && <EventoModal evento={editing} tavoli={tavoli} onClose={() => setEditing(null)} />}
    </div>
  );
};

// ============================================================
// EDITOR POSTO (singolo commensale) - con Pagato + WhatsApp
// ============================================================
const PostoEditor = ({ commensale, numeroPosto, posizionePosto = numeroPosto, tavoloNumero, tavoloSala, evento, tuttiCommensali, onSalva, onClose, isExtra = false }) => {
  const [nome, setNome] = useState(commensale?.nome || '');
  const [telefono, setTelefono] = useState(commensale?.telefono || '');
  const [note, setNote] = useState(commensale?.note || '');
  const [pagato, setPagato] = useState(!!commensale?.pagato);
  const [suggerimenti, setSuggerimenti] = useState([]);
  const inputRef = useRef(null);

  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 100); }, []);

  useEffect(() => {
    if (nome.length < 2) { setSuggerimenti([]); return; }
    const q = nome.toLowerCase();
    const matches = tuttiCommensali
      .filter(c => c.nome.toLowerCase().includes(q) && c.nome.toLowerCase() !== q)
      .filter((c, i, arr) => arr.findIndex(x => x.nome === c.nome) === i)
      .slice(0, 5);
    setSuggerimenti(matches);
  }, [nome, tuttiCommensali]);

  const duplicato = useMemo(() => {
    if (!nome.trim()) return null;
    return tuttiCommensali.find(c =>
      c.nome.toLowerCase().trim() === nome.toLowerCase().trim() &&
      !(c.tavolo === tavoloNumero && c.posto === posizionePosto)
    );
  }, [nome, tuttiCommensali, tavoloNumero, posizionePosto]);

  const salva = () => onSalva({ nome: nome.trim(), telefono: telefono.trim(), note: note.trim(), pagato });
  const libera = () => onSalva({ nome: '', telefono: '', note: '', pagato: false });

  const telefonoValido = normalizzaTelefono(telefono).length >= 10;
  const canWhatsApp = nome.trim() && telefonoValido && evento;

  const inviaWhatsApp = () => {
    if (!canWhatsApp) return;
    const numero = normalizzaTelefono(telefono);
    const articolo = evento.tipo === 'cena' ? 'alla cena' : evento.tipo === 'pranzo' ? 'al pranzo' : "all'evento";
    const emoji = evento.tipo === 'cena' ? '🌙' : evento.tipo === 'pranzo' ? '☀️' : '🎉';
    const posizione = isExtra
      ? `Tavolo ${tavoloNumero} (persona extra ${numeroPosto})`
      : `Tavolo ${tavoloNumero}, posto ${numeroPosto}`;
    const righe = [
      `Ciao ${nome.split(' ')[0] || nome}! 🏛️`,
      '',
      `Ti confermiamo l'iscrizione ${articolo} *${evento.nome}*`,
      `${emoji} ${fmtDataLunga(evento.data)}`,
      `🍽️ Sala ${tavoloSala} — ${posizione}`,
    ];
    if (pagato) righe.push('💰 Quota versata ✓');
    if (note.trim()) righe.push('', `📝 Note: ${note.trim()}`);
    righe.push('', 'Ti aspettiamo!', '_Porta San Benedetto_');
    const url = `https://wa.me/${numero}?text=${encodeURIComponent(righe.join('\n'))}`;
    window.open(url, '_blank');
  };

  return (
    <Modal open={true} onClose={onClose} title={isExtra ? `Tavolo ${tavoloNumero} – Persona extra ${numeroPosto}` : `Tavolo ${tavoloNumero} – Posto ${numeroPosto}`} size="sm">
      <div className="space-y-3">
        <div className="relative">
          <Input ref={inputRef} label="Cognome e nome *" value={nome} onChange={e => setNome(e.target.value)} autoComplete="off" />
          {suggerimenti.length > 0 && (
            <div className="absolute z-10 left-0 right-0 mt-1 bg-white border rounded-xl shadow-lg max-h-40 overflow-y-auto">
              {suggerimenti.map((s, i) => (
                <button key={i} onClick={() => setNome(s.nome)}
                  className="w-full text-left px-3 py-2 hover:bg-blue-50 text-sm border-b last:border-b-0">
                  <p className="font-semibold">{s.nome}</p>
                  <p className="text-xs text-gray-500">Tavolo {s.tavolo}, posto {s.posto}</p>
                </button>
              ))}
            </div>
          )}
        </div>
        {duplicato && (
          <div className="bg-amber-50 border border-amber-200 rounded-xl p-2 text-xs text-amber-800">
            ⚠️ "{duplicato.nome}" è già al tavolo {duplicato.tavolo}, posto {duplicato.posto}
          </div>
        )}
        <Input label="Telefono (WhatsApp)" value={telefono} onChange={e => setTelefono(e.target.value)}
          placeholder="Es. 333 1234567" inputMode="tel" />
        <TextArea label="Note (allergie, intolleranze, esigenze)" rows={2} value={note} onChange={e => setNote(e.target.value)} />

        <Toggle
          label="💰 Quota pagata"
          hint="Attiva se il commensale ha già versato la quota"
          checked={pagato}
          onChange={setPagato}
          color="emerald"
        />

        {evento && (
          <button type="button" onClick={inviaWhatsApp} disabled={!canWhatsApp}
            className={`w-full rounded-xl py-3 font-bold text-sm flex items-center justify-center gap-2 transition shadow-sm ${canWhatsApp ? 'bg-[#25D366] text-white hover:bg-[#128C7E]' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
            <span className="text-lg">📱</span>
            <span>{canWhatsApp ? 'Invia conferma su WhatsApp' : 'Serve nome e telefono valido'}</span>
          </button>
        )}

        <div className="flex gap-2 pt-2">
          {commensale?.nome && <Btn variant="danger" onClick={libera}>{isExtra ? 'Rimuovi extra' : 'Libera posto'}</Btn>}
          <Btn variant="ghost" onClick={onClose} className="flex-1">Annulla</Btn>
          <Btn onClick={salva} className="flex-1" disabled={!nome.trim()}>Salva</Btn>
        </div>
      </div>
    </Modal>
  );
};

// ============================================================
// MODAL TAVOLO - vista posti
// ============================================================
const TavoloModal = ({ tavolo, tavoloId, eventoId, evento, tuttiCommensali, onClose }) => {
  const postoVuoto = () => ({ nome: '', note: '', telefono: '', pagato: false });
  const [commensali, setCommensali] = useState(() => {
    const salvati = Array.isArray(tavolo.commensali) ? tavolo.commensali : [];
    const quanti = Math.max(Number(tavolo.posti) || 0, salvati.length);
    return Array.from({ length: quanti }, (_, idx) => ({ ...postoVuoto(), ...(salvati[idx] || {}) }));
  });
  const [editPosto, setEditPosto] = useState(null);

  const salva = (idx, dati) => {
    const nuovi = [...commensali];
    while (nuovi.length <= idx) nuovi.push(postoVuoto());
    nuovi[idx] = dati;
    while (nuovi.length > tavolo.posti && !nuovi[nuovi.length - 1]?.nome) nuovi.pop();
    setCommensali(nuovi);
    dbUpdate(`taverna/eventi/${eventoId}/tavoli/${tavoloId}`, { ...tavolo, commensali: nuovi });
    setEditPosto(null);
  };

  const occ = commensali.filter(c => c && c.nome).length;
  const pagati = commensali.filter(c => c && c.nome && c.pagato).length;
  const extra = Math.max(0, occ - tavolo.posti);
  const baseCompleta = commensali.slice(0, tavolo.posti).every(c => c && c.nome);
  const extraCompilati = commensali.slice(tavolo.posti).every(c => c && c.nome);
  const salaColor = tavolo.sala === 'gialla' ? 'bg-amber-400' : 'bg-blue-400';

  return (
    <Modal open={true} onClose={onClose} title={`Tavolo ${tavolo.numero} – Sala ${tavolo.sala}`} size="md">
      <div className="space-y-3">
        <div className={`${extra > 0 ? 'bg-gradient-to-r from-red-600 to-red-500' : salaColor} text-white rounded-2xl p-4 flex justify-between items-center shadow-sm`}>
          <div>
            <span className="font-semibold">Occupazione</span>
            <p className="text-xs text-white/80">{extra > 0 ? `Capienza superata di ${extra}` : baseCompleta ? 'Tavolo completo' : `${tavolo.posti - occ} posti disponibili`}</p>
            {occ > 0 && <p className="text-xs text-white/90 mt-0.5">💰 {pagati} pagati su {occ}</p>}
          </div>
          <span className="font-display text-2xl">{occ} <span className="text-white/70">/ {tavolo.posti}</span></span>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
          {commensali.map((c, idx) => {
            const occupato = c && c.nome;
            const isExtra = idx >= tavolo.posti;
            const isPagato = occupato && c.pagato;
            let seatClass;
            if (isExtra) seatClass = isPagato ? 'seat-extra-pagato' : 'seat-extra';
            else if (occupato) seatClass = isPagato ? 'seat-pagato' : 'seat-occupato';
            else seatClass = 'seat-libero hover:bg-blue-50';
            return (
              <button key={idx} onClick={() => setEditPosto(idx)}
                className={`rounded-2xl p-3 text-left card-lift ${seatClass}`}>
                <div className="flex items-center justify-between mb-1">
                  <span className={`text-xs font-bold ${occupato || isExtra ? 'text-white/75' : 'text-gray-400'}`}>{isExtra ? `EXTRA ${idx - tavolo.posti + 1}` : `POSTO ${idx + 1}`}</span>
                  <span className="text-xs flex gap-0.5">
                    {isExtra && !isPagato && <span className="text-[10px] bg-white/20 rounded-full px-1.5 py-0.5">+1</span>}
                    {isPagato && <span title="Pagato">💰</span>}
                    {occupato && !isPagato && !isExtra && <span>👤</span>}
                  </span>
                </div>
                {occupato ? (
                  <>
                    <p className="font-semibold text-sm leading-tight truncate">{c.nome}</p>
                    <div className="flex items-center gap-1.5 mt-1 flex-wrap">
                      {c.telefono && <span className="text-[10px] text-white/80 bg-white/15 rounded-full px-1.5 py-0.5">📞</span>}
                      {c.note && <span className="text-[10px] text-white/80 truncate">⚠ {c.note}</span>}
                    </div>
                  </>
                ) : (
                  <p className="text-xs text-gray-400 italic">libero</p>
                )}
              </button>
            );
          })}
        </div>

        {baseCompleta ? (
          <button onClick={() => setEditPosto(commensali.length)} disabled={!extraCompilati}
            className="w-full rounded-2xl border-2 border-dashed border-red-300 bg-red-50 px-4 py-3 text-sm font-bold text-red-700 hover:bg-red-100 transition disabled:opacity-50 disabled:cursor-not-allowed">
            ＋ Aggiungi persona extra
          </button>
        ) : (
          <p className="text-center text-xs text-gray-500 bg-white/70 border border-gray-200 rounded-xl px-3 py-2">Il pulsante per le persone extra apparirà quando tutti i {tavolo.posti} posti saranno occupati.</p>
        )}

        <Btn variant="ghost" onClick={onClose} className="w-full">Chiudi</Btn>
      </div>

      {editPosto !== null && (
        <PostoEditor
          commensale={commensali[editPosto]}
          tavoloNumero={tavolo.numero}
          tavoloSala={tavolo.sala}
          evento={evento}
          tuttiCommensali={tuttiCommensali}
          isExtra={editPosto >= tavolo.posti}
          numeroPosto={editPosto >= tavolo.posti ? editPosto - tavolo.posti + 1 : editPosto + 1}
          posizionePosto={editPosto + 1}
          onSalva={(dati) => salva(editPosto, dati)}
          onClose={() => setEditPosto(null)}
        />
      )}
    </Modal>
  );
};

// ============================================================
// SALA - DETTAGLIO EVENTO (gestione posti)
// ============================================================
const EventoDettaglio = ({ eventoId, onIndietro }) => {
  const [evento, loading] = useDB(`taverna/eventi/${eventoId}`);
  const [tavoloSelezionato, setTavoloSelezionato] = useState(null);
  const [filtroSala, setFiltroSala] = useState('tutte');

  const tavoliMap = (evento && evento.tavoli) || {};

  const tuttiCommensali = useMemo(() => {
    const arr = [];
    Object.values(tavoliMap).forEach(t => {
      (t.commensali || []).forEach((c, idx) => {
        if (c && c.nome) arr.push({ ...c, tavolo: t.numero, sala: t.sala, posto: idx + 1 });
      });
    });
    return arr.sort((a, b) => a.nome.localeCompare(b.nome));
  }, [tavoliMap]);

  if (loading) return <div className="p-8 text-center text-gray-500">Caricamento...</div>;
  if (!evento || !evento.id) return <div className="p-8 text-center text-gray-500">Evento non trovato</div>;

  const tavoliList = Object.entries(tavoliMap)
    .map(([tid, t]) => ({ tid, ...t }))
    .filter(t => filtroSala === 'tutte' || t.sala === filtroSala)
    .sort((a, b) => (a.numero || 0) - (b.numero || 0));

  let totaleOccupati = 0, totalePosti = 0, totaleExtra = 0, totalePagati = 0;
  Object.values(tavoliMap).forEach(t => {
    totalePosti += t.posti || 0;
    const occupatiTavolo = (t.commensali || []).filter(c => c && c.nome).length;
    const pagatiTavolo = (t.commensali || []).filter(c => c && c.nome && c.pagato).length;
    totaleOccupati += occupatiTavolo;
    totalePagati += pagatiTavolo;
    totaleExtra += Math.max(0, occupatiTavolo - (t.posti || 0));
  });
  const daPagare = totaleOccupati - totalePagati;

  const esportaExcel = () => {
    const ws = XLSX.utils.json_to_sheet(
      tuttiCommensali.map(c => ({
        Cognome_Nome: c.nome,
        Sala: c.sala,
        Tavolo: c.tavolo,
        Posto: c.posto,
        Pagato: c.pagato ? 'SÌ' : 'NO',
        Telefono: c.telefono || '',
        Note: c.note || ''
      }))
    );
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Commensali');
    const riassunto = Object.values(tavoliMap)
      .sort((a, b) => (a.numero || 0) - (b.numero || 0))
      .map(t => {
        const occ = (t.commensali || []).filter(c => c && c.nome).length;
        const pag = (t.commensali || []).filter(c => c && c.nome && c.pagato).length;
        return {
          Tavolo: t.numero, Sala: t.sala, Posti: t.posti,
          Occupati: occ, Pagati: pag, Da_pagare: occ - pag,
          Liberi: Math.max(0, (t.posti || 0) - occ), Eccedenza: Math.max(0, occ - (t.posti || 0)),
          Commensali: (t.commensali || []).filter(c => c && c.nome).map(c => `${c.nome}${c.pagato ? ' ✓' : ''}`).join(', ')
        };
      });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(riassunto), 'Tavoli');
    // Foglio dedicato ai non pagati (utile per solleciti)
    const nonPagati = tuttiCommensali.filter(c => !c.pagato).map(c => ({
      Cognome_Nome: c.nome, Sala: c.sala, Tavolo: c.tavolo, Posto: c.posto, Telefono: c.telefono || ''
    }));
    if (nonPagati.length > 0) {
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(nonPagati), 'Da_pagare');
    }
    XLSX.writeFile(wb, `${evento.nome.replace(/[^a-z0-9]/gi, '_')}_${evento.data}.xlsx`);
  };

  const condividi = async () => {
    const testo = [
      `🏛️ *${evento.nome}*`,
      `📅 ${fmtDataLunga(evento.data)}`,
      `🍽️ ${totaleOccupati}/${totalePosti} posti occupati${totaleExtra > 0 ? ` (+${totaleExtra} extra)` : ''}`,
      `💰 ${totalePagati}/${totaleOccupati} quote pagate`,
      '',
      ...Object.values(tavoliMap)
        .sort((a, b) => (a.numero || 0) - (b.numero || 0))
        .map(t => {
          const commens = (t.commensali || []).filter(c => c && c.nome);
          if (commens.length === 0) return null;
          return `*Tavolo ${t.numero}* (${t.sala}, ${commens.length}/${t.posti}):\n` +
            commens.map((c, i) => `${i + 1}. ${c.nome}${c.pagato ? ' 💰' : ''}`).join('\n');
        })
        .filter(Boolean)
    ].join('\n\n');
    if (navigator.share) {
      try { await navigator.share({ text: testo, title: evento.nome }); } catch (e) {}
    } else {
      try { await navigator.clipboard.writeText(testo); alert('Lista copiata negli appunti'); } catch (e) { alert('Errore'); }
    }
  };

  return (
    <div className="max-w-7xl mx-auto">
      <div className="psb-gradient text-white p-4 sm:p-6">
        <button onClick={onIndietro} className="text-white/80 hover:text-white text-sm flex items-center gap-1 mb-3">
          ← Torna agli eventi
        </button>
        <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
          <div>
            <p className="text-amber-300 text-xs uppercase tracking-wider">{evento.tipo === 'cena' ? '🌙 Cena' : evento.tipo === 'pranzo' ? '☀️ Pranzo' : '🎉 Evento'}</p>
            <h1 className="font-display text-2xl sm:text-3xl">{evento.nome}</h1>
            <p className="text-white/80 capitalize">{fmtDataLunga(evento.data)}</p>
          </div>
          <div className="text-right space-y-2">
            <div>
              <p className="text-amber-300 text-xs">Occupazione</p>
              <p className={`font-display text-3xl ${totaleExtra > 0 ? 'text-red-300' : ''}`}>{totaleOccupati} <span className="text-white/60 text-xl">/ {totalePosti}</span></p>
              <p className={`text-xs ${totaleExtra > 0 ? 'text-red-200 font-bold' : 'text-white/70'}`}>{totaleExtra > 0 ? `+${totaleExtra} persone oltre capienza` : `${totalePosti > 0 ? Math.round(totaleOccupati / totalePosti * 100) : 0}%`}</p>
            </div>
            {totaleOccupati > 0 && (
              <div className="bg-white/10 rounded-xl px-3 py-2 border border-white/15">
                <p className="text-xs text-emerald-300">💰 Quote pagate</p>
                <p className="font-display text-xl">{totalePagati} / {totaleOccupati}</p>
                {daPagare > 0 && <p className="text-[10px] text-red-200">{daPagare} da riscuotere</p>}
              </div>
            )}
          </div>
        </div>
        <div className="flex flex-wrap gap-2 mt-4">
          <Btn variant="gold" onClick={esportaExcel}>📊 Esporta Excel</Btn>
          <Btn variant="gold" onClick={condividi}>📱 Condividi lista</Btn>
        </div>
      </div>

      <div className="bg-white border-b px-4 py-3 flex items-center gap-2 overflow-x-auto">
        <span className="text-sm font-semibold text-gray-600 whitespace-nowrap">Sala:</span>
        {[
          { id: 'tutte', l: 'Tutte' },
          { id: 'gialla', l: '🟡 Gialla' },
          { id: 'azzurra', l: '🔵 Azzurra' }
        ].map(s => (
          <button key={s.id} onClick={() => setFiltroSala(s.id)}
            className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ${filtroSala === s.id ? 'psb-gradient text-white' : 'bg-gray-100 text-gray-600'}`}>
            {s.l}
          </button>
        ))}
      </div>

      <div className="p-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3">
        {tavoliList.map(t => {
          const commensali = t.commensali || [];
          const occ = commensali.filter(c => c && c.nome).length;
          const pag = commensali.filter(c => c && c.nome && c.pagato).length;
          const pieno = occ === t.posti;
          const oltre = occ > t.posti;
          const extra = Math.max(0, occ - t.posti);
          const vuoto = occ === 0;
          const salaColor = t.sala === 'gialla' ? 'border-amber-400' : 'border-blue-400';
          return (
            <button key={t.tid} onClick={() => setTavoloSelezionato(t.tid)}
              className={`surface-card card-lift rounded-2xl p-3 border-t-4 ${oltre ? 'border-red-500 ring-2 ring-red-300' : salaColor} text-left ${pieno && !oltre ? 'ring-2 ring-emerald-400' : ''}`}>
              <div className="flex justify-between items-start mb-2">
                <span className="font-display text-2xl text-blue-900">{t.numero}</span>
                <span className={`text-xs px-2 py-0.5 rounded-full font-bold ${oltre ? 'over-badge' : pieno ? 'bg-emerald-100 text-emerald-700' : vuoto ? 'bg-gray-100 text-gray-500' : 'bg-amber-100 text-amber-700'}`}>
                  {occ}/{t.posti}
                </span>
              </div>
              <div className="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                <div className={`h-full transition-all ${oltre ? 'bg-red-500' : pieno ? 'bg-emerald-500' : 'bg-amber-500'}`} style={{ width: `${Math.min(100, (occ / t.posti) * 100)}%` }}></div>
              </div>
              <div className="flex justify-between mt-1 text-[10px]">
                <p className="text-gray-400 capitalize">Sala {t.sala}</p>
                {occ > 0 && <p className="text-emerald-700 font-bold">💰 {pag}/{occ}</p>}
                {oltre && <p className="text-red-600 font-bold">+{extra}</p>}
              </div>
            </button>
          );
        })}
      </div>

      {tavoloSelezionato && tavoliMap[tavoloSelezionato] && (
        <TavoloModal
          tavolo={tavoliMap[tavoloSelezionato]}
          tavoloId={tavoloSelezionato}
          eventoId={eventoId}
          evento={evento}
          tuttiCommensali={tuttiCommensali}
          onClose={() => setTavoloSelezionato(null)}
        />
      )}
    </div>
  );
};

// ============================================================
// SALA - CONFIGURAZIONE TAVOLI
// ============================================================
const TavoloConfigModal = ({ tavolo, onClose }) => {
  const isNew = !tavolo.id;
  const [form, setForm] = useState({ numero: '', posti: 8, sala: 'gialla', ...tavolo });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const salva = () => {
    if (!form.numero) return alert('Numero obbligatorio');
    if (!form.posti || form.posti < 1) return alert('Numero posti non valido');
    const data = { ...form, numero: Number(form.numero), posti: Number(form.posti) };
    if (isNew) {
      const id = 't' + data.numero;
      dbSet(`taverna/tavoli/${id}`, { ...data, id });
    } else {
      dbUpdate(`taverna/tavoli/${tavolo.id}`, data);
    }
    onClose();
  };
  const elimina = () => {
    if (confirm(`Eliminare il tavolo ${form.numero}?`)) {
      dbRemove(`taverna/tavoli/${tavolo.id}`);
      onClose();
    }
  };
  return (
    <Modal open={true} onClose={onClose} title={isNew ? 'Nuovo tavolo' : `Tavolo ${form.numero}`} size="sm">
      <div className="space-y-3">
        <div className="grid grid-cols-2 gap-3">
          <Input label="Numero" type="number" value={form.numero} onChange={e => set('numero', e.target.value)} />
          <Input label="Posti" type="number" value={form.posti} onChange={e => set('posti', e.target.value)} />
        </div>
        <Select label="Sala" value={form.sala} onChange={e => set('sala', e.target.value)}
          options={[{ value: 'gialla', label: '🟡 Sala gialla' }, { value: 'azzurra', label: '🔵 Sala azzurra' }]} />
        <div className="flex gap-2 pt-2">
          {!isNew && <Btn variant="danger" onClick={elimina}>🗑️</Btn>}
          <Btn variant="ghost" onClick={onClose} className="flex-1">Annulla</Btn>
          <Btn onClick={salva} className="flex-1">Salva</Btn>
        </div>
      </div>
    </Modal>
  );
};

const TavoliSection = ({ tavoli }) => {
  const [editing, setEditing] = useState(null);
  const lista = Object.values(tavoli).sort((a, b) => (a.numero || 0) - (b.numero || 0));
  const gialli = lista.filter(t => t.sala === 'gialla');
  const azzurri = lista.filter(t => t.sala === 'azzurra');
  const totGialla = gialli.reduce((s, t) => s + (t.posti || 0), 0);
  const totAzzurra = azzurri.reduce((s, t) => s + (t.posti || 0), 0);

  const reset = () => {
    if (!confirm('Ripristinare la configurazione tavoli predefinita (Taverna PSB)? Eventuali tavoli aggiunti manualmente verranno persi.')) return;
    const obj = {};
    TAVOLI_DEFAULT.forEach(t => { obj[t.id] = t; });
    dbSet('taverna/tavoli', obj);
  };

  return (
    <div className="p-4 max-w-7xl mx-auto space-y-4">
      <div className="flex flex-col sm:flex-row sm:justify-between gap-2">
        <div>
          <h2 className="font-display text-xl text-blue-900">Configurazione tavoli</h2>
          <p className="text-sm text-gray-500">Layout di riferimento usato per i nuovi eventi</p>
        </div>
        <div className="flex gap-2">
          <Btn variant="ghost" onClick={reset}>↻ Default</Btn>
          <Btn onClick={() => setEditing({})}>+ Nuovo tavolo</Btn>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div className="bg-gradient-to-br from-amber-400 to-amber-600 text-white rounded-2xl p-4">
          <p className="text-xs text-white/80 uppercase tracking-wide">Sala gialla</p>
          <p className="font-display text-2xl">{gialli.length} tavoli</p>
          <p className="text-sm">{totGialla} posti</p>
        </div>
        <div className="bg-gradient-to-br from-blue-500 to-blue-700 text-white rounded-2xl p-4">
          <p className="text-xs text-white/80 uppercase tracking-wide">Sala azzurra</p>
          <p className="font-display text-2xl">{azzurri.length} tavoli</p>
          <p className="text-sm">{totAzzurra} posti</p>
        </div>
      </div>

      {['gialla', 'azzurra'].map(sala => {
        const items = lista.filter(t => t.sala === sala);
        if (items.length === 0) return null;
        return (
          <div key={sala}>
            <h3 className="font-display text-blue-900 mb-2 capitalize flex items-center gap-2">
              {sala === 'gialla' ? '🟡' : '🔵'} Sala {sala}
            </h3>
            <div className="grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-8 gap-2">
              {items.map(t => (
                <button key={t.id} onClick={() => setEditing(t)}
                  className={`bg-white rounded-xl p-3 shadow-sm hover:shadow-md transition border-t-4 ${sala === 'gialla' ? 'border-amber-400' : 'border-blue-400'}`}>
                  <p className="font-display text-2xl text-blue-900">{t.numero}</p>
                  <p className="text-xs text-gray-500">{t.posti} posti</p>
                </button>
              ))}
            </div>
          </div>
        );
      })}

      {editing && <TavoloConfigModal tavolo={editing} onClose={() => setEditing(null)} />}
    </div>
  );
};

// ============================================================
// APP PRINCIPALE
// ============================================================
const App = () => {
  const [logged, setLogged] = useState(() => sessionStorage.getItem('psb_taverna_logged') === '1');
  const [sezione, setSezione] = useState('magazzino');
  const [tabMag, setTabMag] = useState('dashboard');
  const [tabSala, setTabSala] = useState('eventi');
  const [eventoAperto, setEventoAperto] = useState(null);

  const [prodotti] = useDB('taverna/prodotti');
  const [acquisti] = useDB('taverna/acquisti');
  const [fornitori] = useDB('taverna/fornitori');
  const [eventi] = useDB('taverna/eventi');
  const [tavoli, tavoliLoading] = useDB('taverna/tavoli');

  useEffect(() => {
    if (!tavoliLoading && Object.keys(tavoli).length === 0 && firebaseOk) {
      const obj = {};
      TAVOLI_DEFAULT.forEach(t => { obj[t.id] = t; });
      dbSet('taverna/tavoli', obj);
    }
  }, [tavoliLoading, tavoli]);

  const onLogin = () => { sessionStorage.setItem('psb_taverna_logged', '1'); setLogged(true); };
  const onLogout = () => { sessionStorage.removeItem('psb_taverna_logged'); setLogged(false); };

  if (!logged) return <Login onLogin={onLogin} />;

  if (eventoAperto) {
    return (
      <div className="min-h-screen">
        <Header sezione={sezione} setSezione={setSezione} onLogout={onLogout} />
        <EventoDettaglio eventoId={eventoAperto} onIndietro={() => setEventoAperto(null)} />
      </div>
    );
  }

  const tabsMag = [
    { id: 'dashboard', icon: '📊', label: 'Dashboard' },
    { id: 'prodotti', icon: '📦', label: 'Prodotti' },
    { id: 'acquisti', icon: '🧾', label: 'Acquisti' },
    { id: 'fornitori', icon: '🏪', label: 'Fornitori' },
  ];
  const tabsSala = [
    { id: 'eventi', icon: '🍽️', label: 'Eventi' },
    { id: 'tavoli', icon: '🪑', label: 'Tavoli' },
  ];

  return (
    <div className="min-h-screen">
      <Header sezione={sezione} setSezione={setSezione} onLogout={onLogout} />
      {sezione === 'magazzino' ? (
        <>
          <SubNav tabs={tabsMag} active={tabMag} onChange={setTabMag} />
          {tabMag === 'dashboard' && <MagazzinoDashboard prodotti={prodotti} acquisti={acquisti} fornitori={fornitori} />}
          {tabMag === 'prodotti' && <ProdottiSection prodotti={prodotti} />}
          {tabMag === 'acquisti' && <AcquistiSection acquisti={acquisti} prodotti={prodotti} fornitori={fornitori} />}
          {tabMag === 'fornitori' && <FornitoriSection fornitori={fornitori} />}
        </>
      ) : (
        <>
          <SubNav tabs={tabsSala} active={tabSala} onChange={setTabSala} />
          {tabSala === 'eventi' && <EventiSection eventi={eventi} tavoli={tavoli} onApriEvento={setEventoAperto} />}
          {tabSala === 'tavoli' && <TavoliSection tavoli={tavoli} />}
        </>
      )}
      <footer className="text-center py-6 text-xs text-gray-400">
        Taverna Porta San Benedetto • <span className="font-display">Giochi de le Porte</span>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
